<!DOCTYPE html>
<html lang="en">

<head>

    <title>Sign in</title>
</head>

<body>
    <form>
        <H1>Regestration Form</H1>
        <div>
            <label for="name">Name</label><br>
            <input type="text" id="Name" placeholder="Enter Name">
        </div>
        <div>
            <label for="phone">Phone Number</label><br>
            <input type="phone" id="phone" placeholder="Mobile Number">
        </div>
        <div>
            <label for="email">E-mail</label><br>
            <input type="email" id="email" placeholder="E-mail">
        </div>

        <div>
            <label for="Password">Password</label><br>
            <input type="password" id="Password" placeholder="password">
        </div>
        <div>
            <p>Gender</p>
            <input type="radio" name="gender" id="Male">
            <label for="Male">Male</label><br>

            <input type="radio" name="gender" id="Female">
            <label for="Female">Female</label><br>
        </div><br>
        <div>
            <p>Order Your Clothes
</p><br>
            <input type="checkbox" name="jeans" id="jeans">
            <label for="jeans">jeans</label>

            <input type="checkbox" name="t-shirt" id="t-shirt">
            <label for="t-shirt">t-shirt</label>

            <input type="checkbox" name="Men Shirt" id="Men Shirt">
            <label for="Men Shirt">Men Shirt</label>

            <input type="checkbox" name="Skirt" id="Skirt">
            <label for="Skirt">Skirt</label>
        </div><br>
        <button>Reset</button>
        <button>Submit</button>

    </form>
</body>

</html>
